<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="智卷 · 在线测评系统：教师用 Word 出卷与自动阅卷，学生在线作答与成绩查询" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>智卷</title>
    <script>
      // Use the same preference as the React provider before first paint.
      (() => {
        const role = /^\/(teacher|student|admin)(?:\/|$)/i.exec(location.pathname)?.[1].toLowerCase();
        if (role) document.documentElement.dataset.uiRole = role;
        let preference;
        try { preference = localStorage.getItem('zhijuan-ui-theme'); } catch {}
        document.documentElement.dataset.theme =
          preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
